[project]
name = "exhbma"
version = "0.2.0"
description = "Exhaustive Search with Bayesian Model Averaging"
authors = [{ name = "Koki Obinata", email = "koki.obi.321@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.23.2,<3.0",
    "scipy>=1.9.2,<2.0",
    "pydantic>=1.10,<3.0",
    "tqdm>=4.64.1,<5.0",
    "matplotlib>=3.6.0,<4.0",
]

[project.urls]
Repository = "https://github.com/okada-lab/exhbma"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "black>=25.0",
    "isort>=6.0",
    "flake8>=7.0",
    "mypy>=1.13",
    "types-setuptools",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exhbma"]

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "scipy",
    "scipy.*",
    "matplotlib",
    "matplotlib.*",
]
follow_imports = "skip"

[tool.coverage.run]
source = ["exhbma"]
omit = ["tests/*"]
