[project]
name = "exhbma"
version = "0.2.0"
description = "Exhaustive Search with Bayesian Model Averaging"
authors = [{ name = "Koki Obinata", email = "koki.obi.321@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.23.2,<3.0",
    "scipy>=1.9.2,<2.0",
    "pydantic>=1.10,<3.0",
    "tqdm>=4.64.1,<5.0",
    "matplotlib>=3.6.0,<4.0",
]

[project.urls]
Repository = "https://github.com/okada-lab/exhbma"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exhbma"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"exhbma/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["exhbma", "tests"]

[tool.coverage.run]
source = ["exhbma"]
omit = ["tests/*"]
