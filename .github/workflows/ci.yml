name: CI (exhbma)

on: push

jobs:
  ci-fs-bma:
    name: "CI: exhbma package (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python packages
        run: uv sync --all-groups

      - name: Format
        run: |
          make format
          test -z "$(git status -s)"

      - name: Lint
        run: make lint

      - name: Test(full)
        run: make test-full

      - name: Check requirements.txt for sphinx deployment
        if: matrix.python-version == '3.12'
        run: |
          uv export --group dev --format requirements-txt --no-hashes --no-header -o /tmp/requirements.txt
          diff docs/requirements.txt /tmp/requirements.txt
